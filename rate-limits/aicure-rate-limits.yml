note: >-
  No rate limits are documented or implemented. The OpenDBM REST API ships no limiter middleware -
  the published FastAPI application registers only three exception handlers and two routers - and
  emits no RateLimit-*, X-RateLimit-* or Retry-After headers. Because consumers run the service
  themselves, throughput is bounded by their own hardware and by the OpenFace/Docker processing
  time per media file rather than by a vendor quota. The commercial platform at api.aicure.com
  publishes no developer documentation, so any limits it enforces are not knowable from public
  material and none have been guessed here.
