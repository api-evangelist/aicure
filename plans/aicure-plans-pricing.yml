note: >-
  AiCure publishes no pricing of any kind. Every commercial call to action on aicure.com routes to
  "Book a Demo" or the contact form; there is no pricing page, no tier table, no quota, no trial and
  no self-serve sign-up. The platform is sold to pharmaceutical sponsors and CROs under negotiated
  per-study contracts, and its CRO partner programme (AiPEX) is a partnership agreement rather than
  a published plan. The one free thing AiCure ships is OpenDBM, which is AGPL-3.0 open source and
  self-hosted - no cost, and no plan either.
