summary: >-
  AiCure ships no MCP server. This is a DERIVED candidate tool list showing what an MCP server over
  the published OpenDBM REST API would expose; it is not an agent surface AiCure operates, and no
  MCPServer pointer is emitted in apis.yml. The pointer type used is X-MCPServerCandidate.
