  description: >-
    AiCure's OpenDBM calculates digital biomarkers of health and functioning from video or audio of
    an individual's behavior - facial activity, voice, movement and speech - in one package. It is
    the library the self-hosted OpenDBM REST API wraps, so it is the native-language interface to
    the same capability rather than a REST client generated from a spec.
