    stable versions 2.0 and 2.1 that were never published to PyPI, and both of its "Changelog" links
    (github.com/AiCure/open_dbm/releases/tag/v2.0.0 and .../v2.1.0) return HTTP 404. A consumer
    installing from PyPI gets a 2022 beta, not the 2.1 the docs describe.
