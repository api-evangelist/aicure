summary: >-
  AiCure publishes one first-party package: opendbm, the Python library behind its open-source
  OpenDBM digital-behavioral-measurement toolkit. Registry search of npm, PyPI, RubyGems,
  crates.io, NuGet, Maven Central and pkg.go.dev found no other AiCure-published library, and no
  client SDK exists for the commercial H.Code platform because that platform has no public API.
