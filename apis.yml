apis:
- aid: aicure-opendbm-rest-api
  name: OpenDBM REST API
  description: >-
    The OpenDBM REST API is a self-hosted FastAPI service published inside AiCure's open-source
    OpenDBM repository (rest_api/). It exposes the OpenDBM digital-biomarker pipeline over HTTP:
    an OAuth2 password-grant login that returns a JWT, a multipart file upload, and six analysis
    operations that run facial, acoustic, movement and speech measurement over an uploaded video or
    audio file and return a ZIP of CSV results. It is run by the consumer on their own machine or
    infrastructure (the documented development base is http://127.0.0.1:8000); AiCure does not host
    a public instance of it.
  humanURL: https://aicure.github.io/open_dbm/extras/odbm-rest-api
