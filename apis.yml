aid: aicure
name: AiCure
description: >-
  AiCure (AICure Corporation, New York) builds AI-driven patient engagement and medication-adherence
  software for clinical trials. Its H.Code platform uses smartphone computer vision to confirm dosing,
  captures audio and video for digital phenotyping, and feeds predictive analytics, ePRO and site
  dashboards for sponsors, CROs and investigative sites. The commercial platform is sold to sponsors
  and CROs and has no public self-serve developer program: the production host api.aicure.com is an
  AWS API Gateway that answers every anonymous path with 403 Missing Authentication Token, and
  login.aicure.com is a customer sign-in SPA. AiCure's one public, machine-readable API surface is
  OpenDBM, the AGPL-3.0 open-source digital-behavioral-measurement toolkit it publishes at
  github.com/AiCure/open_dbm, which ships a self-hosted FastAPI REST service (POST /odbm/v1/*) with
  OAuth2 password-grant JWT auth alongside a Python library on PyPI.
