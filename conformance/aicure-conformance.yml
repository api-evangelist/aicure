summary: >-
  AiCure publishes a named compliance posture for its commercial clinical-trial platform - ISO 27001
  and SOC 2 certifications, and HIPAA, GDPR and 21 CFR Part 11 compliance for long-term storage of
  protected health information. Those are corporate/regulatory claims on its own security page, not
  contract-level assertions; the only machine-checkable conformance in the public surface is the
  OpenDBM REST API's use of the OAuth2 password grant and JWT bearer tokens.
